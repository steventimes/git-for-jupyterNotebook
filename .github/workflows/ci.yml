name: Validate extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.130.0', 'stable']
    runs-on: ubuntu-24.04
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install isolated desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - run: npm run test:host
      - run: npm run test:ui
      - run: npm run benchmark
      - run: npm run package
      - name: Install and test the same VSIX
        run: npm run test:vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extension-linux-validation-${{ matrix.vscode }}
          path: |
            *.vsix
            output/release.json
            output/performance.json
            output/playwright/product/**
            .tmp/host-results.json
            .tmp/vsix-host-results.json
          if-no-files-found: warn

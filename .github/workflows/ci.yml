name: Validate extension
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    outputs:
      package-id: ${{ steps.package.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Build the VSIX once
        run: npm run package
      - run: node --test --test-isolation=none out/tests/unit/*.test.js out/tests/integration/*.test.js
      - run: node out/tests/performance.js
      - id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-package-linux-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            output/packages/*.vsix
            output/packages/*.vsix.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extension-quality-linux-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: output/performance.json
          if-no-files-found: warn
  linux:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.130.0', 'stable']
    runs-on: ubuntu-24.04
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.quality.outputs.package-id }}
          path: output/packages
          merge-multiple: true
      - name: Install isolated desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox fonts-noto-cjk fonts-noto-color-emoji
      - run: npm run compile
      - name: Install and test the shared VSIX
        run: |
          vsix_path="$(node -p "const manifest = require('./package.json'); 'output/packages/' + manifest.name + '-' + manifest.version + '.vsix'")"
          node scripts/testing/run.cjs vsix "$vsix_path"
          node scripts/testing/run.cjs ui "$vsix_path"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extension-linux-validation-${{ matrix.vscode }}-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            output/release.json
            output/ui-release.json
            output/playwright/product/**
            .tmp/vsix-host-results.json
            .tmp/ui-live.json
          if-no-files-found: warn
